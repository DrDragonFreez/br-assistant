# Override для машины без NVIDIA GPU.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# Либо: make up-cpu
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: []
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

  # На CPU реранкер съедает слишком много времени, поэтому обращение
  # к нему выключено настройкой ниже и граф переходит на MMR.
  #
  # Имя профиля совпадает с базовым файлом намеренно: иначе
  # `--profile reranker` поверх этого оверлея молча не поднимал бы
  # сервис, и причину пришлось бы искать в двух файлах сразу.
  # Поднять его здесь всё же можно — ответ станет заметно дольше.
  reranker:
    profiles: ["reranker"]

  backend:
    environment:
      RERANKER_ENABLED: "false"
      LLM_TIMEOUT_SECONDS: "300"
      UVICORN_WORKERS: "1"

  celery-worker:
    environment:
      RERANKER_ENABLED: "false"
      LLM_TIMEOUT_SECONDS: "300"
      CELERY_CONCURRENCY: "1"
