# Общие заголовки проксирования.
# Монтируется в /etc/nginx/proxy_common.conf — см. volumes сервиса nginx.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;

# Таймауты и proxy_redirect заданы один раз в блоке http файла nginx.conf.
# Здесь их держать нельзя: файл подключается внутрь location, а location,
# которому нужен свой таймаут (поток SSE — 600s), объявляет директиву
# второй раз в том же контексте, и nginx не стартует с ошибкой
# «proxy_read_timeout directive is duplicate». Значения из http
# наследуются, а переопределение в location остаётся возможным.
