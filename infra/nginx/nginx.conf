user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────── ЛОГИ (без query-string: там могут быть токены) ───────────────────
    log_format main_json escape=json
        '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"ua":"$http_user_agent","upstream":"$upstream_addr"}';
    access_log /var/log/nginx/access.log main_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  75s;
    client_max_body_size 50M;
    client_body_buffer_size 1m;
    client_body_timeout 120s;
    large_client_header_buffers 4 16k;

    # ─────────────────── GZIP ───────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/vnd.ms-fontobject application/x-font-ttf
        font/opentype image/svg+xml;

    # ─────────────────── RATE LIMIT ───────────────────
    # Общий лимит рассчитан на интерфейс, который читает данные пачками:
    # один экран — это 4-5 запросов, быстрое переключение между диалогами
    # добавляет по два. Дорогие операции ограничены отдельными зонами ниже.
    limit_req_zone  $binary_remote_addr zone=api_zone:10m    rate=300r/m;
    limit_req_zone  $binary_remote_addr zone=chat_zone:10m   rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_conn_status 429;

    # ─────────────────── ПРОКСИРОВАНИЕ: значения по умолчанию ───────────────────
    # Наследуются всеми location; отдельные location их переопределяют
    # (поток SSE ждёт ответ до 600s, чат и генерация документов — 300s).
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    proxy_redirect off;

    # ─────────────────── UPSTREAMS (только docker-имена) ───────────────────
    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    upstream frontend_upstream {
        server frontend:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }
    upstream grafana_upstream {
        server grafana:3000 max_fails=3 fail_timeout=15s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # ─────────────────── БЕЗОПАСНОСТЬ ───────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        limit_conn conn_zone 40;

        # Healthcheck самого nginx
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ─────────────────── AUTH: самый жёсткий лимит (брутфорс) ───────────────────
        # Лимит защищает от подбора пароля, поэтому относится только к
        # эндпоинтам, которые пароль принимают. Точное совпадение имеет
        # приоритет над префиксом ^~ ниже.
        location = /api/v1/auth/login {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location = /api/v1/auth/password {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # Остальные эндпоинты авторизации работают по уже выданному
        # токену: /auth/me запрашивается при восстановлении сессии,
        # /auth/refresh — по истечении access-токена на каждой вкладке,
        # /auth/logout — при выходе. Подбору они не подвержены, а под
        # лимитом в 5 запросов в минуту активная работа в интерфейсе
        # получала 429, после чего клиент терял сессию.
        location ^~ /api/v1/auth/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # ─────────────────── SSE STREAMING: буферизация ВЫКЛ ───────────────────
        location ^~ /api/v1/chat/stream {
            limit_req zone=chat_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Сжатие снимается и здесь, вторым рубежом. Директива gzip off
            # запрещает сжимать ответ самому Nginx, но не мешает это
            # сделать приложению: о поддержке сжатия оно узнаёт из
            # заголовка запроса, который проходит насквозь. Сжатый поток
            # событий браузер разобрать по частям не может.
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering "no" always;
        }

        # Основной эндпоинт объявлен без завершающего слеша (POST /api/v1/chat),
        # и location с слешем его не ловил бы: запрос уходил бы в общее
        # location /api/ с лимитом 60 запросов в минуту вместо 20.
        location = /api/v1/chat {
            limit_req zone=chat_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        # Жёсткий лимит чата нужен обращениям к модели. Список диалогов,
        # их содержимое и оценки ответов модель не затрагивают, а при
        # переключении между диалогами запросов выходит много. Префикс
        # длиннее, поэтому выигрывает у общего ^~ /api/v1/chat/ ниже.
        location ^~ /api/v1/chat/sessions {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location ^~ /api/v1/chat/messages {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location ^~ /api/v1/chat/ {
            limit_req zone=chat_zone burst=10 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        # ─────────────────── ДОКУМЕНТЫ ───────────────────
        # Готовность отчёта о проверке и готовность черновика опрашиваются
        # до появления результата, то есть многократно. Под лимитом
        # загрузки (10 запросов в минуту) опрос упирался в 429 раньше,
        # чем Celery успевал разобрать документ, и проверка обрывалась
        # ошибкой при исправно отработавшей задаче. Префиксы со слешем
        # ловят только чтение по идентификатору: POST /documents/validate
        # и POST /documents/generate остаются под лимитом загрузки.
        # Адреса без завершающего слеша описаны точным совпадением: иначе
        # префикс со слешем ниже заставит nginx ответить 301 на запрос
        # ровно по этому адресу, и загрузка файла не дойдёт до бэкенда.
        location = /api/v1/documents/validate {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size 50M;
            proxy_request_buffering off;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        location = /api/v1/documents/generate {
            limit_req zone=upload_zone burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        location = /api/v1/documents/generated {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location ^~ /api/v1/documents/validate/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        location ^~ /api/v1/documents/generated/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        # ─────────────────── ЗАГРУЗКА ДОКУМЕНТОВ (до 50 МБ) ───────────────────
        location ^~ /api/v1/documents/ {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size 50M;
            proxy_request_buffering off;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_read_timeout 300s;
        }

        # ─────────────────── ОСТАЛЬНОЕ API ───────────────────
        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_common.conf;
        }

        # Метрики backend наружу не отдаются: эндпоинт подключён в корень
        # приложения (/metrics), а наружу проксируется только /api/, так что
        # через Nginx он недостижим в принципе. Запрет оставлен на случай,
        # если метрики когда-нибудь подключат с префиксом версии.
        location = /api/v1/metrics { deny all; return 403; }
        location = /api/metrics { deny all; return 403; }

        # ─────────────────── GRAFANA (sub-path) ───────────────────
        location /grafana/ {
            # Слеша в конце proxy_pass быть не должно.
            #
            # Grafana поднята с GF_SERVER_SERVE_FROM_SUB_PATH=true, то есть
            # сама ожидает путь вместе с префиксом «/grafana/» и строит по
            # нему свои перенаправления. Слеш на конце proxy_pass префикс
            # срезает: Grafana получала «/login», отвечала перенаправлением
            # на «/grafana/login», Nginx срезал префикс снова — и так до
            # исчерпания числа переходов. Панели не открывались вовсе.
            proxy_pass http://grafana_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ─────────────────── СТАТИКА NEXT.JS ───────────────────
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_common.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─────────────────── FRONTEND ───────────────────
        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_common.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        error_page 429 = @ratelimited;
        location @ratelimited {
            default_type application/json;
            return 429 '{"detail":"Слишком много запросов. Повторите позже."}';
        }
    }
}
